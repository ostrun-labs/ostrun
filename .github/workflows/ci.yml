name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore gateway/OstrunGateway.csproj

      - name: Build
        run: dotnet build gateway/OstrunGateway.csproj --no-restore --configuration Release

  build-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore generator/OstrunGenerator.csproj

      - name: Build
        run: dotnet build generator/OstrunGenerator.csproj --no-restore --configuration Release

  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog.json
        run: |
          set -euo pipefail
          status=0

          if ! jq empty catalog.json 2>/dev/null; then
            echo "::error file=catalog.json::not valid JSON"
            exit 1
          fi

          seen_refs=""
          count=$(jq '.services | length' catalog.json)
          for i in $(seq 0 $((count - 1))); do
            ref=$(jq -r ".services[$i].ref // empty" catalog.json)
            repository=$(jq -r ".services[$i].repository // empty" catalog.json)
            rev=$(jq -r ".services[$i].rev // empty" catalog.json)

            if [ -z "$ref" ] || [ -z "$repository" ] || [ -z "$rev" ]; then
              echo "::error file=catalog.json::services[$i] is missing ref, repository, or rev"
              status=1
              continue
            fi

            if ! [[ "$ref" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]]; then
              echo "::error file=catalog.json::services[$i].ref '$ref' must be lowercase '{provider}/{service}'"
              status=1
            fi

            if [[ " $seen_refs " == *" $ref "* ]]; then
              echo "::error file=catalog.json::duplicate ref '$ref'"
              status=1
            fi
            seen_refs="$seen_refs $ref"

            if ! [[ "$repository" =~ ^https:// ]]; then
              echo "::error file=catalog.json::services[$i].repository '$repository' must be an https URL"
              status=1
            fi
          done

          exit $status

  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate contract file/title/version consistency
        run: |
          set -euo pipefail
          status=0
          shopt -s globstar nullglob
          for f in contracts/**/*.v*.json; do
            echo "Checking $f"

            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::not valid JSON"
              status=1
              continue
            fi

            filename=$(basename "$f")
            file_entity="${filename%%.v*}"
            file_version="${filename##*.v}"
            file_version="${file_version%.json}"

            provider_dir=$(basename "$(dirname "$(dirname "$f")")")
            service_dir=$(basename "$(dirname "$f")")

            title=$(jq -r '.title // empty' "$f")
            version=$(jq -r '.version // empty' "$f")

            if [ -z "$title" ] || [ -z "$version" ]; then
              echo "::error file=$f::missing title or version field"
              status=1
              continue
            fi

            IFS='.' read -r title_provider title_service title_entity <<< "$title"

            if [ "$(echo "$title_provider" | tr '[:upper:]' '[:lower:]')" != "$provider_dir" ]; then
              echo "::error file=$f::title provider '$title_provider' does not match directory '$provider_dir'"
              status=1
            fi

            if [ "$(echo "$title_service" | tr '[:upper:]' '[:lower:]')" != "$service_dir" ]; then
              echo "::error file=$f::title service '$title_service' does not match directory '$service_dir'"
              status=1
            fi

            if [ "$title_entity" != "$file_entity" ]; then
              echo "::error file=$f::title entity '$title_entity' does not match filename '$file_entity'"
              status=1
            fi

            if [ "$file_version" != "$version" ]; then
              echo "::error file=$f::filename version 'v$file_version' does not match schema version '$version'"
              status=1
            fi
          done
          exit $status
