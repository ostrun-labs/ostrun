name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore gateway/OstrunGateway.csproj

      - name: Build
        run: dotnet build gateway/OstrunGateway.csproj --no-restore --configuration Release

  build-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore generator/OstrunGenerator.csproj

      - name: Build
        run: dotnet build generator/OstrunGenerator.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test generator.Tests --configuration Release

  # Runs on every PR rather than only when catalog.json, contracts/** or
  # generator/** change: a path filter would need its own maintenance, and the
  # job is cheap (one shallow clone per catalog entry).
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate catalog
        run: dotnet run --project generator -- validate --catalog catalog.json --contracts contracts

  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate contracts
        run: dotnet run --project generator -- validate --contracts contracts
